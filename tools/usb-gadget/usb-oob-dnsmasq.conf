# Drop-in for NetworkManager shared-mode dnsmasq on usb0, the USB-C OOB link.
# Install as /etc/NetworkManager/dnsmasq-shared.d/usb-oob.conf
#
# The laptop still gets an address automatically, so there is nothing to
# configure at the rack, but it must NOT get a default route or DNS from this
# link or the console server would take over the laptop internet connection.
#
# In dnsmasq an option with no value means "do not send it at all".
# Option 3 is the router / default gateway. Option 6 is the DNS server list.
# Comments are kept on their own lines: an inline comment after the value is
# indistinguishable from a value in a syntax check.
dhcp-option=3
dhcp-option=6

# Option 121 is the classless static route option, which macOS honours. This
# hands out a route to the HaLow segment so the same cable reaches every node
# behind this Pi, without touching the laptop default route. Adjust the prefix
# if a site uses a different HaLow subnet.
dhcp-option=121,10.41.0.0/16,192.168.44.1
